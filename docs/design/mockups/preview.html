<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CaseLoop UI concepts</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f1f5f9; color: #0f172a; }
      body { margin: 0; padding: 32px; }
      header, section { max-width: 1440px; margin: 0 auto 28px; }
      header p { color: #475569; }
      section { padding: 18px; border: 1px solid #e2e8f0; border-radius: 18px; background: white; }
      h2 { margin: 0 0 14px; font-size: 18px; }
      img { display: block; width: 100%; height: auto; border: 1px solid #e2e8f0; }
      code { color: #991b1b; }
      @media (max-width: 600px) { body { padding: 14px; } section { padding: 10px; } }
    </style>
  </head>
  <body>
    <header>
      <h1>CaseLoop UI concepts</h1>
      <p>Review at presentation size. Import the original SVG files into Figma to edit individual vector shapes.</p>
    </header>
    <section>
      <h2>Authentication landing</h2>
      <img src="auth-landing.svg" alt="CaseLoop authentication landing page concept" />
    </section>
    <section>
      <h2>Read-only response register</h2>
      <img src="response-register.svg" alt="Responder view of the response register" />
    </section>
    <section>
      <h2>Administrator dashboard</h2>
      <img src="admin-dashboard.svg" alt="CaseLoop administrator dashboard concept" />
    </section>
  </body>
</html>
